  sidebar:
    style: "docked"
    search: true
    contents:
      - section: "首页"
        href: wiki/index.qmd
      - section: "活动知识"
        contents:
          - wiki/activities/buy-a-gift-b.qmd
          - wiki/activities/city-badge.qmd
